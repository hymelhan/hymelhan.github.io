<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Hymelhan | Socials</title>
        <link rel="icon" href="../assets/logo.png" type="image/png"/>
        <link rel="stylesheet" href="../styles.css"/>
        <meta property="og:title" content="Blank" />
        <meta property="og:description" content="How did you found this."/>
        <meta property="og:image" content="https://hymelhan.github.io/assets/logo.png"/>
        <script
            src="https://code.jquery.com/jquery-3.3.1.js"
            integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60="
            crossorigin="anonymous">
        </script>
        <script> 
            $(function(){
                $("#header").load("../header.html"); 
                $("#footer").load("../footer.html"); 
            });
        </script>
        <style>
            #socials {
                color: #a134cf;
            }
            #socials:hover {
                background-color: rgb(32, 32, 32);
            }
        </style>
    </head>
    <body>
        <div id="header"></div>
        <div class="content">
            <div class="socials-box">
                <div class="socials-discord-box">
                    <div>
                        <h1>Discord</h1>
                        <p style="width: 500px; margin: 0 25px 0 0;">The Hymelhan Discord server is where the community chats and hangs out. Join our <span id="member-count">Loading..</span>, give feedback on the map, share what you created, be the first notifed with Hymelhan related updates and much more! You might also see sneak peaks :eyes:</p>
                        <script>
                            async function updateMemberCount() {
                                try {
                                    const response = await fetch(
                                        "https://discord.com/api/v9/invites/ep26BCdcpk?with_counts=true"
                                    );
                                
                                    if (!response.ok) {
                                        throw new Error(`HTTP ${response.status}`);
                                    }
                                
                                    const data = await response.json();
                                
                                    document.getElementById("member-count").textContent =
                                        `${data.approximate_member_count.toLocaleString()} members`;
                                } catch (error) {
                                    console.error(error);
                                    document.getElementById("member-count").textContent =
                                        "N/A members";
                                }
                            }

                            updateMemberCount();
                        </script>
                        <a href="https://discord.gg/ep26BCdcpk">
                            <button type="button" class="button-450" style="width: 230px; margin: 25px 0; background-color: #5865f2;">
                                <img src="../assets/discord.svg" alt="Discord icon" style="height: 40px; width: 40px; margin: 5px 20px;">
                                <p>Join now!</p>
                            </button>
                        </a>
                    </div>
                    <iframe
                        src="https://discord.com/widget?id=1535122616397070506&theme=dark"
                        allowtransparency="true"
                        sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
                        style="width:350px; height:500px; border: none; border-radius: 5px; margin-bottom: 25px;">
                    </iframe>
                </div>
                <hr>
                <div class="socials-youtube-box">
                    <h1>YouTube</h1>
                </div>
            </div>
        </div>
        <div id="footer"></div>
    </body>
</html>
