<!DOCTYPE html>

        <link rel="icon" href="assets/logo.png" type="image/png"/>

        <script>

                    <div class="download-button">

                        <img src="assets/info.svg" alt="Info" style="height: 20px; width: 20px; margin: 2px 2px auto auto;" title="Contains all required mods with the addition of QoL and perfomance mod">
                    </div>
                    <div class="download-button">
                        <img src="assets/download.svg" alt="Download icon" style="height: 40px; width: 40px; margin: 5px 20px;">

                        <img src="assets/info.svg" alt="Info" style="height: 20px; width: 20px; margin: 2px 2px auto auto;" title="Only Contains required mods">
                    </div>
                    <h2>Files</h2>
                    <p>Download each individual files</p>
                    <div class="download-button">
                        <img src="assets/download.svg" alt="Download icon" style="height: 40px; width: 40px; margin: 5px 20px;">
